<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Update Password</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <script th:src="@{/js/validatePasswords.js}"></script>
</head>
<body>
<div class="container">
    <div class="logo">
        <img th:src="@{/images/logosonaged.jpg}" alt="Logo de l'entreprise">
    </div>
    <h1>Mis à jour du mot de passe</h1>
    <form th:action="@{/auth/update-password}" method="post" onsubmit="return validatePasswords(event)">
        <input type="hidden" name="token" th:value="${token}">
        <label for="newPassword">Entrez le nouveau mot de passe:</label>
        <input type="password" id="newPassword" name="newPassword" required>
        <br>
        <label for="confirmPassword">Confirmez le nouveau mot de passe:</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required>
        <br>
        <button type="submit">Enregistrer</button>
    </form>

    <!-- Afficher les messages de succès ou d'erreur -->
    <div th:if="${message}" style="color: green;">
        <p th:text="${message}"></p>
    </div>
    <div th:if="${error}" style="color: red;">
        <p th:text="${error}"></p>
    </div>
</div>
</body>
</html>

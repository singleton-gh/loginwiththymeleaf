<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Reset Password</title>
</head>
<body>
<form th:action="@{/auth/reset-password}" method="post">
    <label for="email">Email:</label>

    <button type="submit">Reset Password</button>
</form>
</body>
</html>
